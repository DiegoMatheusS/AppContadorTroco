name: Android CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      APP_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Instalar Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Testar regras
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Montar APK de debug
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ContadorTroco-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Preparar assinatura permanente
        if: github.event_name == 'push'
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$KEYSTORE_B64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "Assinatura nao configurada: faltam secrets. APK debug continua disponivel."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::add-mask::$KEYSTORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          KEYSTORE_PATH="$RUNNER_TEMP/contador-trocas-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Compilar APK de distribuicao assinado
        if: github.event_name == 'push' && steps.signing.outputs.ready == 'true'
        run: gradle :app:assembleRelease --stacktrace
      - name: Publicar APK assinado
        if: github.event_name == 'push' && steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ContadorTroco-assinado-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
